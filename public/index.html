<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Screen Control Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #fff;
}

/* верхняя панель */
.header {
    padding: 15px;
    background: #161a22;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2a2f3a;
}

.title {
    font-size: 18px;
    font-weight: bold;
    color: #4ea1ff;
}

/* контейнер */
.container {
    display: flex;
    height: calc(100vh - 60px);
}

/* боковая панель */
.sidebar {
    width: 280px;
    background: #141821;
    border-right: 1px solid #2a2f3a;
    padding: 10px;
    overflow-y: auto;
}

.device {
    background: #1b2130;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.device:hover {
    background: #273149;
}

.status {
    font-size: 12px;
    color: #8fd18f;
}

/* экран */
.screen {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0d12;
}

.screen img {
    width: 90%;
    border-radius: 10px;
    border: 2px solid #2a2f3a;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

/* кнопка */
button {
    padding: 8px 12px;
    background: #4ea1ff;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
    <div class="title">🖥 Screen Control Panel</div>
    <button onclick="connect()">Connect</button>
</div>

<div class="container">

    <div class="sidebar">
        <h3>Devices</h3>
        <div id="devices"></div>
    </div>

    <div class="screen">
        <img id="screen">
    </div>

</div>

<script>
let ws;
let token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/login.html";
}

function connect() {
    ws = new WebSocket(location.origin.replace("https","wss").replace("http","ws"));
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
        ws.send(JSON.stringify({
            type: "auth",
            role: "viewer",
            token: token
        }));
    };

    ws.onmessage = (e) => {

        // список устройств
        if (typeof e.data === "string") {
            const msg = JSON.parse(e.data);

            if (msg.type === "devices") {
                const box = document.getElementById("devices");
                box.innerHTML = "";

                msg.list.forEach(id => {
                    const div = document.createElement("div");
                    div.className = "device";
                    div.innerHTML = `
                        <b>${id}</b><br>
                        <span class="status">online</span>
                    `;

                    div.onclick = () => {
                        alert("Selected: " + id);
                    };

                    box.appendChild(div);
                });
            }
        }

        // экран
        if (e.data instanceof ArrayBuffer) {
            const blob = new Blob([e.data], { type:"image/jpeg" });
            document.getElementById("screen").src = URL.createObjectURL(blob);
        }
    };
}
</script>

</body>
</html>
